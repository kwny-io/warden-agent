name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # 手动触发：发布链路的"能不能真跑一次"不该只有"推一个公开 tag"这一条路。
  # 没有这个入口时，想验证签名链路就必须先对外发布——等于用"发布"换"验证"，
  # 门槛高到没人会去验，于是"签名流水线"永远停在"存在但从未运行"。
  # tag 入参声明为 required：手动跑也**必须**显式给出发布版本，不让分支名冒充版本号。
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并签名的发布 tag（必须显式给出，形如 v0.1.0）"
        required: true
        type: string
  # 每周定时跑一次：**依赖与基镜像的新 CVE 不需要改代码就会出现**，
  # 只在 push/PR 上扫描的话，"没人提交"就等于"没人检查"。
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC

# 最小权限：workflow 默认只需读代码。需要写权限的 job（镜像签名推 GHCR + OIDC）
# 在 job 级单独声明、覆盖这里——不给全 workflow 开大权限。
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 起一个真实 PostgreSQL：让"存储可换 PostgreSQL"从**声称支持**变成**在 CI 里被验证**。
    # 此前 PG 集成测试是 skipif 跳过的、CI 里也没有库 —— 等于那段代码从未在自动化环境跑过。
    # 用 trust 认证免密，与本仓库测试的连接约定（用户 postgres、空密码、库 warden）一致。
    #
    # 第六十三批起**钉住 digest**：这是门禁自己执行的容器（被测代码连它跑集成测试），
    # 浮动 tag 被上游重推就会换成另一个程序，而这件事在 CI 输出里看不出来。
    # 台账、取法与验证方式（含反面对照）见 tests/test_ci_tool_pinning.py 顶部。
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: warden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WARDEN_TEST_PG_HOST: localhost
      WARDEN_TEST_PG_DB: warden
      WARDEN_TEST_PG_USER: postgres
      WARDEN_TEST_PG_PASSWORD: ""
    steps:
      # 第三方 action 一律钉到**不可变的 commit SHA**（tag 可被移动，SHA 不会），
      # 行尾注释给出对应版本，便于人工升级时知道钉的是哪一版。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # 用 uv 按 uv.lock 安装：**依赖版本可复现**。
      # `--frozen` 禁止重新解析 —— lock 与 pyproject 不一致时 CI 直接失败，
      # 而不是"悄悄装到别的版本上，本地过、CI 挂"。
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (按 uv.lock 固定版本)
        run: uv sync --frozen --extra dev
      # pg_dump / pg_restore 不在 ubuntu-latest 的默认镜像里。
      # 不装的话 tests/test_backup_retention.py 的 pg_dump 端到端会**静默跳过**，
      # 备份链路就永远没在 CI 里真跑过。装上后由下面的防静默跳过守卫一并守住。
      - name: 安装 postgresql-client（让 pg_dump 端到端测试真的跑）
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      # promtool 的**真值求值**（tests/test_alert_rules_evaluated.py 的第 3 步）要本机
      # 已有 prom/prometheus 镜像——那个测试**故意不联网拉镜像**（测试不该联网），
      # 所以预热只能发生在 workflow 里。之前没人拉它 ⇒ 那条求值用例**每天在 CI 里跳过**、
      # 而 CI 每天绿：「告警规则被真求值过」在门禁里是空的（与上面 pg_dump、下面 web/dist 同一个形状）。
      # 它由「跳过签字」守卫（scripts/check_skipped_tests.py + tests/SKIP_LEDGER.yaml）看着：
      # 那条签字是 `allowed_in: [local]`——**这步一旦被删，守卫在 CI 里直接变红**。
      # tag 未钉 digest：取不到权威 digest（理由记在 tests/test_ci_tool_pinning.py 的待钉台账里），
      # 与 `container` job 里跑 promtool 的那个容器同 tag。
      - name: 预热规则求值镜像（让 promtool 真值求值真的跑）
        run: docker pull prom/prometheus:v2.55.0
      # SPA 测试（tests/test_web.py::test_t10）在 web/dist 缺失时跳过。
      # 之前 CI 从不构建前端 → 它**每次都在跳过**。这里显式构建，让它真的执行。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 前端门禁（lint + 类型检查 + 单测与覆盖率 + 构建）
        # 四件事都要显式跑，每一件都补过一个真实的口子：
        #  · `npm run lint`（eslint）：hooks 依赖数组漏项这类错误**类型系统看不见**，
        #    只有 hooks 规则能拦（eslint-plugin-react-hooks）。
        #  · `npm run typecheck`（`tsc --noEmit`）：`vite build` 只用 esbuild **转译、
        #    不做类型检查**，所以此前 TS 类型错误能让 CI 全绿（类型门禁形同虚设）。
        #  · `npm run test:coverage`（vitest）：前端此前**零测试**；现在 11 个文件 /
        #    129 个用例，并带覆盖率下限（vite.config.ts 里 thresholds）。
        #  · `npm run build`：产出 `web/dist`，让后端 SPA 服务测试（tests/test_web.py::test_t10）
        #    不再因产物缺失而静默跳过。
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
      - name: 真浏览器 e2e（Playwright：CSP 在真引擎里不挡自己的资源）
        # 为什么要占 CI 时间：CSP 的失败模式是**静默降级**——响应头存在不代表页面能跑。
        # 行内 style、动态注入的脚本、SSE 一旦被策略挡住，页面不会报错，只是功能悄悄消失。
        # 而 `tests/` 里的断言跑在 TestClient 上（根本没浏览器引擎），挡不住这类回归；
        # 这一条用真 chromium 加载**打包产物**（不是 vite dev server）才能暴露。
        # `--with-deps` 装系统库（Linux runner 上缺库会直接起不来 chromium）；
        # 后端由 web/e2e/start-e2e-server.mjs 起（回环 + WARDEN_ALLOW_ANON=1，理由写在该文件里）。
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: 安装 ts 客户端依赖（让真实 MCP 集成在 CI 里真的跑）
        # `tests/test_mcp.py` 有 4 条"真实连接"用例，门控在 `client_ready()` 上（`src/warden_agent/mcp/client.py:262`），
        # 它要求 `ts/mcp-client/node_modules` 存在（入口 `mcp-client.mjs` 是签入的源码，不需要构建）。
        # 而 workflow 从来没装过它 ⇒ 这 4 条**每天都在 CI 里跳过**、CI 每天绿（第六十五批从 CI 日志的
        # SKIPPED 行里实录：`环境不具备真实 MCP 集成条件：ts 客户端依赖未安装`）。
        # 与上面 `docker pull prom/prometheus` 同一个形状：**前置条件必须在 workflow 里备好**，
        # 否则"在本机才跑"的用例在 CI 里就只是绿色噪声。
        # 注意：这里刻意**不去 tests/SKIP_LEDGER.yaml 里签字**。签字是"允许留洞"，
        # 而这是一个可以直接堵上的洞（npm ci + package-lock.json 就能复现）。
        # 它由"跳过签字"守卫看着：这步一被删，那 4 条又会跳过、而它们没有签字 ⇒ CI 直接红。
        working-directory: ts/mcp-client
        run: npm ci
      - name: Ruff (lint)
        run: uv run --frozen ruff check src tests scripts
      - name: Mypy (strict)
        run: uv run --frozen mypy src/warden_agent
      - name: Pytest（含覆盖率门槛）
        # `-rs` 让跳过原因也打进日志：CI 里"跳过"和"通过"看起来一样绿，
        # 不写原因就没法判断是不是该跑的被静默跳过了。
        # `--cov` 同时**执行覆盖率门禁**：`fail_under` 配在 pyproject.toml（单一事实源，
        # 基线 89% / 门槛 86%，见那里的注释），这里不再重复写数字——避免"两个地方各写一个阈值"漂移。
        # `--junitxml` 产出机器可读报告，供下一条"防静默跳过"守卫解析（不必再重跑一遍子集）。
        run: |
          uv run --frozen pytest --tb=short -rs -p no:cacheprovider --cov=warden_agent \
            --junitxml=/tmp/pytest-junit.xml
      - name: 上传 junit（Pytest 红了也要有，供本地用 CI 的真数据核"跳过台账"）
        # 为什么必须 `if: always()`：守卫最该被复核的时刻恰恰是 Pytest 红的时候。
        # 而"跳过集"是**按环境变的**（第六十五批实录：本机是 4 条，CI 里是 8 条；
        # 其中 4 条 test_mcp 只在 CI 跳过，因为 CI 没装 ts 客户端依赖）。
        # 拿不到 CI 的 junit，就只能拿本机的 junit 去核台账——那正是本批踩的坑：
        # 台账是用"我机器上的观察"建的，而它要守的是 CI。
        # 本地复核（不用重跑测试）：
        #   gh run download <run-id> -n pytest-junit -D /tmp/ci-junit
        #   uv run --frozen python scripts/check_skipped_tests.py \
        #     --junitxml /tmp/ci-junit/pytest-junit.xml
        # `if-no-files-found: error`：junit 是上游步骤的产物，没了就大声红，不静默降级。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pytest-junit
          path: /tmp/pytest-junit.xml
          if-no-files-found: error
      - name: K8s manifests 校验（kubeconform，官方 schema 严格模式）
        # 只查**字段合法性**（官方 schema）；"我们的要求"（探针齐全、优雅停机时间小于
        # terminationGracePeriodSeconds、非 root + rootfs 只读、不用 :latest、多副本必配 PG…）
        # 由 tests/test_k8s_manifests.py 离线守着——那条在 Pytest 里已经跑了。
        run: |
          # 第六十三批起钉住 digest：门禁执行体的身份必须可复现（台账见 tests/test_ci_tool_pinning.py）。
          docker run --rm -v "$PWD/deploy/k8s:/m:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -summary -strict /m
      - name: 交付/演练清单的镜像引用（钉 digest 或进台账）
        # 为什么单独一条：它**不需要网络、不需要 docker**，所以到处都能跑；但它守的失败模式很贵——
        # `deploy/k8s/backup-cronjob.yaml` 里用的是浮动 tag 的 postgres，于是“CI 验的那个 postgres”
        # 和“备份时真跑的那个”是两回事（第六十四批实录）。
        # 判定逻辑在 scripts/check_pinned_images.py 里，本地同样能跑（不搞成“只能在 CI 里验”）。
        run: uv run --frozen python scripts/check_pinned_images.py
      - name: Markdown 表格里的竖线（未转义会被 GFM 当分隔符）
        # 为什么单独一条：这条失败模式的**静默**程度很高——`git diff` 里那一行完全正常，
        # 而 GitHub 上它会被多切出格子，多余的格内容**直接不显示**。第七十二批实测：
        # `README.md` 第 535 行（首页的功能表）就这样丢过两格，`docs/复核索引.md` 也丢过；
        # 权威渲染器的行为（gfm 的 <table> 输出）写在 `scripts/check_md_tables.py` 的文档里。
        # 不需要网络、不需要 docker；判定逻辑在脚本里，本地同样能跑。
        run: uv run --frozen python scripts/check_md_tables.py
      - name: 断言 PostgreSQL 集成测试真的执行了（防静默跳过）
        # 为什么单独一条：PG 集成测试用 skipif 保护（没有库时跳过，保证本地/无库 CI 不红）。
        # 副作用是——**如果 CI 里的 service 没连上，它们会静默跳过、CI 依然绿**，
        # 于是"在 CI 里验证 PG"这句话就是空的。这条把那种情况变成明确失败。
        # 脚本**按标记自动发现**所有 PG 依赖测试文件（`_pg_available` / `_postgres_available`
        # / `_HAS_PG`，含 pg_dump 端到端），不再手写文件名清单——手写清单漏一个就留一个口子。
        # 它直接解析上面 Pytest 步骤的 junit 报告（每个用例带文件信息），所以不必重复跑子集。
        run: uv run --frozen python scripts/check_pg_tests_ran.py --junitxml /tmp/pytest-junit.xml
      - name: 断言被跳过的用例都有人签字（防静默跳过，覆盖所有轴）
        # 上一步只守 **PG 一条轴**。这一步是它的一般化：读同一份 junit，要求**每一条**
        # 被跳过的用例都在 tests/SKIP_LEDGER.yaml 里有人签字，并区分两种承诺——
        #   `allowed_in: [local]`  本地可以跳，**CI 里必须真跑**
        #   `allowed_in: [ci]`     CI 里这个场景不成立，那**本地必须真跑**
        # 所以上面那几处预热（pg_dump / web/dist / promtool 镜像）一被删、或者谁新增一条
        # “本机有才跑”的用例没签字，这里就红——「跳过」不再能静默地装在绿里。
        run: uv run --frozen python scripts/check_skipped_tests.py --junitxml /tmp/pytest-junit.xml

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 为什么单独一个 job：quality 里跑的全是"在源码树上"的检查——**镜像从来没被构建过**。
    # 于是 Dockerfile 改坏了（漏拷文件、依赖装不上、前端产物没拷进去）CI 发现不了，
    # 等真要交付时才发现"镜像构建不出来"。这个 job 真的 build + 起容器 + 打探针。
    # 它此前真的抓到过 bug：依赖用未加引号的 $(...) 展开，被 pywin32 的环境标记（含空格）
    # 切出一个 `==` 依赖名，pip 直接失败——镜像一直构建不出来而无人知晓。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: 容器构建冒烟（build + run + 健康探针 + 鉴权 fail-closed）
        run: bash scripts/container_smoke.sh warden-agent:ci
      - name: 校验 Prometheus 规则语法（promtool）
        # 规则库的"引用是否存在"由 tests/test_alert_rules.py 守；这里补语法的官方校验。
        # 注意 `--entrypoint promtool`：prom/prometheus 镜像的入口就是 prometheus 本体，
        # 直接把它当命令后缀会被当成 prometheus 的参数（`unexpected promtool`）。
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability/alerts:/a:ro" \
            prom/prometheus:v2.55.0 \
            check rules /a/warden.rules.yml /a/warden.slo.yml
      - name: 镜像漏洞扫描（trivy：HIGH/CRITICAL 且**有修复**才失败）
        # `--ignore-unfixed`：只对"有修复可用"的漏洞失败。基镜像里常见"尚无修复"的包
        # （perl / util-linux 等），把它们也算失败会让门禁变成噪声、最后被人关掉。
        #
        # 《诚实更正（第四十四批）》这句原来写着"实测：基镜像拉新后 0 命中"——它随基镜像
        # 更新失效了：2026-10-02 在拉新基镜像（--pull）后仍命中 **1 条 HIGH**：
        # libpcre2-8-0 CVE-2026-103111（10.46-1~deb13u2 → 已修复 10.46-1~deb13u3）。
        # 修法是在 Dockerfile 里**显式升级该包**（见 Dockerfile 运行阶段顶部），不是放宽门禁。
        # （早先"陈旧缓存会命中 13 条"那个数字是当时的实测，不能当成现状引用。）
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress warden-agent:ci

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 依赖漏洞扫描：按 uv.lock 固定的**运行依赖**做门禁。
    # 为什么单独一个 job、而不是塞进 quality：它跟"代码质量"是两条独立的信号
    # （代码全绿但依赖爆了 CVE 是完全可能的），分开跑能让红的是哪一类一眼看清。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (按 uv.lock 固定版本，含 dev)
        run: uv sync --frozen --extra dev
      - name: 依赖漏洞扫描（pip-audit，只扫运行依赖）
        # 只扫 `--no-dev` 的导出：运行依赖进了交付镜像，dev 依赖不进镜像、风险面小得多。
        # 想连 dev 一起看，去掉 --no-dev 即可（本地跑过：dev 也干净）。
        run: |
          uv export --frozen --no-emit-project --no-dev -o /tmp/req.txt
          uv run --frozen pip-audit -r /tmp/req.txt --strict

      - name: SAST（bandit）—— 打印全部发现（含 Low，只记录不拦截）
        # 为什么不让这条失败：Low 一档里多是**有意写法或误报**——
        # B101 assert、B110 try/except/pass、B112 try/except/continue、
        # B404/B603 subprocess 列表调用（无 shell）、B107 空默认口令。
        # 打印出来是为了"看得见"，拦截交给下一条（只看 Medium+）。
        run: uv run --frozen bandit -r src/warden_agent || true

      - name: SAST 门禁：Medium 及以上必须为 0
        # 基线（2026-09-23）：Medium 0、Low 28。
        # 此前 `migrations.py` 里两处 B608（常量表名的 f-string）用 `# nosec B608` 显式接受；
        # item 4 已把该文件删除（迁移改成显式 schema 版本），现在**无任何 #nosec 压制**，
        # Medium 0 是真实扫描结果。将来若出现必须压制的项，按 tests/SAST_SUPPRESSION_LEDGER.yaml
        # 的格式写清理由与签字人——**散文不算断言**（下面那条守卫只认台账里的条目）。
        #
        # 口径要说准（第七十四批实测）：这条命令拦的是「Medium 及以上 **且 High confidence**」。
        # B608（SQL 字符串拼接）、B113（requests 无 timeout）这类是 Medium/**LOW** confidence，
        # 在 `--confidence-level medium` 下**根本不会被报出来**（实测 results=0、exit=0）。
        # 所以名字里的“Medium 及以上”不等于“覆盖所有 Medium”。这个差距由
        # scripts/check_sast_gate.py 看着：一旦出现“Medium 档但被 confidence 漏掉”的发现，
        # 它会红，并要求要么修掉、要么把口径登记清楚。
        run: uv run --frozen bandit -r src/warden_agent --severity-level medium --confidence-level medium

      - name: 断言 SAST 门禁的口径没被静默关掉（压制 / 空扫描 / 参数 / 配置旁路）
        # 为什么单独一条：门禁可以被三行之外的东西关掉，而且绿 run 里全都看不出来——
        #   ① 一行 `# nosec` 让它从红变绿（实测：exit 1 → 0，bandit 自己的 skipped_tests 从 0 → 1）；
        #   ② 目标写错/目录改名 ⇒ bandit 扫 0 行照样 exit=0（实测 loc=0、exit=0）；
        #   ③ `.bandit` / `[tool.bandit] skips` 换一份配置；
        #   ④ `|| true` / `--skip` / `--exit-zero` 直接把它变成哑巴。
        # 脚本把本文件里那两个步骤当**被测物**（参数、目标、禁用词），并跑正/负两个对照：
        # 正对照证明“含 Medium 缺陷的夹具会被拦”，负对照自检证明“上述拦截真的喂到了扫描器”。
        run: uv run --frozen python scripts/check_sast_gate.py

      - name: 秘密扫描（gitleaks，扫全历史）
        # 扫 **history** 而不只是工作区：已提交过的凭据也要能发现（就算后来删掉，历史里还在）。
        # 用 CLI 而不是 gitleaks-action：后者对**组织**仓库需要 license；CLI 是 MIT 的，没这个限制。
        #
        # --config 必须**显式**给：gitleaks 只在进程 cwd（容器里是 /）找 .gitleaks.toml，
        # 不会去 --source 指向的目录里找。实测：不传 --config 时仓里的 .gitleaks.toml 完全不生效
        # （7 处命中照报），等于白写。
        #
        # 诚实更正：本步骤原来写着“本地实测 60 个 commit 扫完，无泄漏”——那句话随仓库变长失效了
        # （108 commits 时 7 处命中，全是脱敏/审批隔离用例的假夹具）。夹具用 allowlist 精确放宽，
        # 理由与踩过的坑（复数 allowlists 静默失效、paths/regexes 是 OR）都写在 .gitleaks.toml 顶部。
        run: |
          # 第六十三批起钉住 digest，而且必须与 scripts/gitleaks_reverse_control.sh 里那个
          # **同一个** digest——反向对照的全部意义就是"证明扫描器没被关掉"，两个程序不同就
          # 什么都证明不了。台账与取法见 tests/test_ci_tool_pinning.py 顶部。
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact -v

      - name: 秘密扫描反向对照（证明扫描器没被关掉、且 allowlist 是按值收窄的）
        # 逻辑在 scripts/gitleaks_reverse_control.sh 里（本地也能跑，避免“只能在 CI 里验”）。
        #
        # 判据是 gitleaks 的**退出码**，不是输出文本：这里第一版写的是
        # `grep -q "leaks found"`，而 "no leaks found" **也含**这个子串 → 实测两种情形都匹配，
        # 这条对照**永真**、根本没在验（典型的假绿）。已改成退出码 + 写入负面对照自检。
        run: bash scripts/gitleaks_reverse_control.sh

  mutation:
    name: 变异测试（${{ matrix.shard }}）
    # 变异测试（mutation testing）：证明「测试全绿」不等于「测试有效」。
    # 覆盖率只能回答「这行跑过没有」，回答不了「这行改错了会被发现吗」；变异测试把源码里的
    # 比较符 / 边界 / 布尔 / 返回值逐个改掉再跑测试：测试仍绿 = 这段逻辑**没有任何测试约束它**。
    # 本仓库最典型的两个风险点（评审批错 → 越权执行；脱敏漏一个分支 → 明文密钥进日志）
    # 都不会让覆盖率掉一个点，却会被变异测试直接照出来。
    #
    # 为什么分片 + matrix：突变体是**逐个**跑的，一片 = 一个模块组 + 只跑覆盖它的那几个测试文件。
    # 分片后每片一个小 job，彼此并行；否则串行的一大块只能夜间跑。
    # 分片名单的**唯一来源**是 scripts/mutation_shards.py 的 SHARDS 表，下面这份 matrix 与它
    # 一致性由 tests/test_mutation_shards.py 盯着（表格说一套、CI 跑另一套是最隐蔽的失真）。
    # 本地想只跑改动涉及的片：python scripts/mutation_shards.py changed --only-affected
    #
    # 为什么只在夜间 + 手动跑：一批突变体仍然是「分钟级」的量，放进每次 PR 的 CI 里没人会等，
    # 而「没人等」的门禁最后一定会被关掉。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core-security
          - concurrency
          - ratelimit
          - patch-guard
    # push / PR 上跳过，只在定时（每周一 03:00 UTC）和手动触发时跑。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install（按 uv.lock 固定版本，含 dev —— mutmut 在 dev 组里）
        run: uv sync --frozen --extra dev
      - name: 变异测试 + 分数门禁（${{ matrix.shard }}）
        # 分数口径见 scripts/mutation_gate.py：timeout 不算「杀死」（慢机器 ≠ 覆盖），
        # 分母扣掉 skipped / no_tests（没配测试的代码不该被算作「测住了」）。
        # 门槛由 scripts/mutation.sh 从**实测基线**往下留 2 个点给出；尚无实测基线的分片
        # 只报告分数、不判红（编出来的门槛会被人关掉，而被关掉的门禁等于没有门禁）。
        # 用 uv run 跑：mutmut 装在 .venv 里，不在 runner 的 PATH 上。
        # 跑之前脚本会按分片表重写 [tool.mutmut]，退出时一定还原（trap），不会弄脏工作区。
        run: uv run --frozen bash scripts/mutation.sh --shard=${{ matrix.shard }}

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 交付面缺口 item 5：migration 检查。
    # item 4 删掉 `store/migrations.py` 后，迁移改成**显式 schema 版本**（启动补列 +
    # 把目标版本写进 `__schema_version__` 单行表）。这套机制缺一个守门人：谁加了表/列
    # 却忘了 `_SCHEMA_VERSION += 1`，启动照旧成功，老库停在上一个版本，
    # "记录版本"和"真实结构"就悄悄分叉——直到某次写入按新 schema 静默出错。
    # `scripts/check_migrations.py` 真起一个新库、读出结构指纹与签入快照对比，
    # 把这个分叉变成红灯（结构变了而版本没升 = 明确失败）。
    # 和 quality 一样起**真 PG**：两个后端的目标版本与结构必须一致，
    # 只查 SQLite 会漏掉 PG 侧漂移（"可换存储"是本仓库的明确承诺）。
    # 镜像同样钉 digest（理由与台账见 tests/test_ci_tool_pinning.py 顶部）。
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: warden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WARDEN_TEST_PG_HOST: localhost
      WARDEN_TEST_PG_DB: warden
      WARDEN_TEST_PG_USER: postgres
      WARDEN_TEST_PG_PASSWORD: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (按 uv.lock 固定版本)
        run: uv sync --frozen --extra dev
      - name: SQLite 迁移检查（新库版本 + 结构指纹对比签入快照）
        run: uv run --frozen python scripts/check_migrations.py --backend sqlite
      - name: PostgreSQL 迁移检查（同一份快照，验证两后端结构一致）
        run: uv run --frozen python scripts/check_migrations.py --backend postgres

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 交付面缺口 item 5：SBOM（软件物料清单）。
    # 为什么要有它：trivy 只回答"**当前**基镜像里有没有已知漏洞"，不回答"这个镜像里
    # 到底装了什么"。SBOM 是**成分清单**（OS 包 + Python 依赖 + 版本 + 许可证），
    # 它让"某天爆出一个新 CVE、我受不受影响"变成一次本地查询，而不是重建镜像再扫。
    # 扫的是**真镜像**（不是源码树）：交付出去的是镜像，OS 层的包只有镜像里才有。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: 构建镜像（SBOM 的扫描对象就是交付镜像本身）
        # 与 container job 的构建重复是有意的：SBOM 必须描述"按当前源码构建出的那个镜像"，
        # 不能描述一个可能过期的缓存产物。将来 publish 步骤落地后，
        # 这里换成按 registry 里的 digest 扫描即可（那时不必再本地 build）。
        run: docker build --pull -t warden-agent:sbom .
      - name: 生成 SBOM（syft / SPDX JSON）并上传为构建产物
        # anchore/sbom-action 底层就是 syft；用 action 而不是手写 `docker run syft`，
        # 是为了顺带处理"产物上传"（upload-artifact: true）与版本固定。
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: warden-agent:sbom
          format: spdx-json
          output-file: warden-agent.spdx.json
          artifact-name: warden-agent-sbom
          upload-artifact: true

  evals-real:
    # 真实模型质量门禁（提示注入 / 指令遵循 / 幻觉抵抗 / 工具选择）。
    #
    # 为什么单独一个 job，而不是塞进 quality：它要花真钱、要联网、而且是**概率性**的——
    # 不能拖累那个"确定性、必须绿"的门禁。
    #
    # 为什么没 key 就**跳过**而不是失败：fork / 外部 PR 拿不到 secret，
    # 把它们的 PR 直接弄红，只会让下一个人给这步加 `continue-on-error`，门禁名存实亡。
    # 但跳过是**显式**的：日志里写明"未配置 key → 跳过"，不假装跑过（也不出"质量 100%"）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (按 uv.lock 固定版本)
        run: uv sync --frozen
      - name: 模型质量评测（--mode real）
        id: eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 签字开关：只在“没 key”这个事实发生时才有意义。它不是“跳过就算验过”，
          # 而是把默认行为从“静默绿”改成“要么红、要么一次显式签字”。
          # 为什么写在 workflow 里而不是仓库变量：可 diff、可 review、守卫断言得到、本地 clone 能复现。
          ALLOW_EVAL_SKIP: "1"
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            if [ "$ALLOW_EVAL_SKIP" != "1" ]; then
              echo "::error::没有 DEEPSEEK_API_KEY，也没有签字（ALLOW_EVAL_SKIP != 1）——真实模型质量评测**没有跑**"
              echo "::error::要么配好仓库 secret DEEPSEEK_API_KEY，要么在 ci.yml 里显式写下 ALLOW_EVAL_SKIP: \"1\" 表示接受跳过。"
              exit 1
            fi
            echo "::notice::未配置 DEEPSEEK_API_KEY，且已签字（ALLOW_EVAL_SKIP=1）→ 跳过真实模型质量评测（既不失败，也不算跑过）"
            {
              echo "### 真实模型质量评测：**未运行**"
              echo
              echo "原因：仓库未配置 \`DEEPSEEK_API_KEY\`；本次按 \`ALLOW_EVAL_SKIP=1\` 签字跳过。"
              echo "证据：本次 run 的 artifact \`eval-skip-receipt\`（**有它 ⇔ 真评测没跑**）。"
            } >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY'
          import json, os, pathlib
          pathlib.Path("eval-skip-receipt.json").write_text(
              json.dumps(
                  {
                      "skipped": True,
                      "job": "evals-real",
                      "step": "模型质量评测（--mode real）",
                      "reason": "DEEPSEEK_API_KEY 未配置，且 ALLOW_EVAL_SKIP=1（已签字）",
                      "signed_by": "ci.yml 里的 ALLOW_EVAL_SKIP（=1）",
                      "repo": os.environ.get("GITHUB_REPOSITORY"),
                      "run_id": os.environ.get("GITHUB_RUN_ID"),
                      "sha": os.environ.get("GITHUB_SHA"),
                      "event": os.environ.get("GITHUB_EVENT_NAME"),
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 退码 1 = 低于阈值（真门禁）；退码 2 = 环境/参数问题（含"忘了配 key"）
          uv run --frozen python -m warden_agent.evals --mode real --min-pass-rate 0.6 --detail

      - name: 跳过回执（只在跳过分支产生；有它 ⇔ 真实评测没跑）
        if: steps.eval.outputs.skipped == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: eval-skip-receipt
          path: eval-skip-receipt.json
          if-no-files-found: error
          retention-days: 30

  image-signing:
    # 交付面缺口 item 5：镜像签名（先 push GHCR，再签）。
    # 两个入口：push v* tag（正式发布）｜workflow_dispatch（手动真跑一次）。
    # ⚠️ PR 上**不会**触发：没有可发布对象，硬签只会把 PR 弄红——
    # 与"新门禁不得误伤 PR"的取向一致。
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 覆盖顶层的 contents: read：这里需要写 GHCR + OIDC。
    permissions:
      contents: read
      packages: write     # 推镜像到 GHCR
      id-token: write     # cosign keyless：用 GitHub OIDC 换**短期**签名证书，无长期私钥可泄露
    env:
      # 两个入口的 tag 来源不同，先归一：push tag → ref_name；手动 → 显式入参。
      # 手动入口的入参在 workflow 层声明为 required，所以这里不会是空值。
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: 发布 tag 合法性（fail-closed）
        # 分支名或任意字符串不能被当成发布版本：容器 tag 与签名身份都以它为锚，
        # 事后审计"这一版是什么"必须一眼可读。
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) echo "release tag: $RELEASE_TAG" ;;
            *) echo "::error::发布 tag 必须以 v<数字>… 开头（当前: '$RELEASE_TAG'）。手动触发请在 tag 入参里显式给出，例如 v0.1.0"
               exit 1 ;;
          esac
      - name: 构建并推送到 GHCR（并取回 registry 的权威 digest）
        id: push
        # GHCR 的仓库路径必须小写，而 github.repository 保留大小写 → 显式转小写。
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo}:${RELEASE_TAG}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --pull -t "$image" .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          docker push "$image"
          # 签名对象必须是 **digest**，不是 tag：tag 可以被移动/覆盖，签名跟着 tag 走
          # 就等于"签了一个以后可能指向别的东西的名字"。digest 不可变，签名才落得实。
          # 取值走 registry（imagetools inspect）而不是本地镜像的 RepoDigests：
          # 本地那份是"我推上去的那个"，registry 那份才是"别人会拉到的那个"。
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          if ! printf '%s' "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::从 registry 取回的 digest 不合法: '$digest'"
            exit 1
          fi
          echo "IMAGE_DIGEST=ghcr.io/${repo}@${digest}" >> "$GITHUB_ENV"
          {
            echo "### 不可变引用（部署就用这一串）"
            echo '```'
            echo "ghcr.io/${repo}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 安装 cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - name: cosign keyless 签名（对象 = 镜像 digest）
        # keyless：不管理任何长期私钥；cosign 用 OIDC 身份换 Fulcio 短期证书，
        # 签名与证书进 Rekor 透明日志，事后可审计"谁在什么时候签的"。
        run: |
          cosign sign --yes "$IMAGE_DIGEST"
      - name: 立刻独立校验这条签名（只签名不验证 = "我以为签上了"）
        # 用**外部可复现的**验证者约束去验：本 workflow 的 OIDC 身份 + GitHub 的 issuer。
        # 等于把"别人将来能不能验"提前跑一遍；命令原样写进 summary，便于事后自查。
        run: |
          cosign verify "$IMAGE_DIGEST" \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          {
            echo "### 事后独立校验这条签名（复制即可复跑）"
            echo '```bash'
            echo "cosign verify ${IMAGE_DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/${{ github.repository }}/\\.github/workflows/' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 把 digest 钉进部署清单（产出可直接 apply 的引用）
        # 复用仓库自己的脚本（fail-closed：解析不出 digest、**或清单里没有可回写的占位符**，
        # 都非 0 退出——后者是「空 diff」的形状：本步绿灯+summary 里 diff 为空，
        # 而清单里仍是占位符，照着它 apply 会在**上线时**才 manifest unknown），
        # 在 runner 里改写 deploy/k8s/*.yaml 的占位 image:，再把 diff 打进 job summary——
        # 这样"签名的那一个"与"准备部署的那一个"是**同一个字符串**，不靠人抄。
        run: |
          scripts/pin_image_digests.sh --app-image "$IMAGE"
          git --no-pager diff --stat
          {
            echo "### 已钉进清单的引用（把这份 diff 落到部署分支即可）"
            echo '```diff'
            git --no-pager diff -- deploy/k8s | sed -n '1,120p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
