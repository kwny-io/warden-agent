# Warden Agent Python —— 一键部署 (服务 + PostgreSQL)
#
# 用法：
#   docker compose up --build
# 会同时起：
#   - app   ：Agent HTTP/SSE 服务 (http://localhost:8000/docs)
#   - db    ：PostgreSQL 存储（数据存到命名卷，重启不丢）
#
# 想接真实模型：在同目录 `docker compose.env` 或下面加 DEEPSEEK_API_KEY。
# 想用 Postgres 存储：目前 run_server 默认用 SQLite；要用 PG，把 app 的启动
# 改成一个读 PG 的入口（见 store/postgres.py），或在代码里传 PostgresStore。

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # - DEEPSEEK_API_KEY=sk-xxx   # 取消注释接真实 DeepSeek
      - PORT=8000
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden-secret
      POSTGRES_DB: warden
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
