# Warden Agent —— 可观测性整栈（Prometheus + Alertmanager [+ blackbox_exporter]）
#
# 用途：① 把 deploy/observability/alerts/*.rules.yml 真正加载起来（否则规则库只是摆设）；
#       ② 本地演练告警：把 warden 起在本机 8000，起这套栈，人为制造错误率/挂起 Run，
#          看告警是否按预期出现。
#
# 用法：
#   # 1) 备好抓取用的 token（内容就是你的 WARDEN_API_KEY），只读挂进 prometheus
#   printf '%s' "$WARDEN_API_KEY" > warden_token
#   # 2) 起栈（ALERT_WEBHOOK_URL 可先留空/换成你的网关）
#   ALERT_WEBHOOK_URL=https://example.invalid/hook docker compose -f docker-compose.yml up -d
#   # 3) 打开 Prometheus UI -> Status/Rules，确认规则已加载；Alerts 页看触发情况
#   注意：warden 应用要跑在宿主机 8000（本栈通过 host.docker.internal 抓它）。
#   token 文件含密钥，**别提交**（已在 .gitignore 里）。
services:
  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # 保留期必须 ≥ SLO 最长窗口（warden.slo.yml 的 rate[30d]）：样本一旦被回收，
      # 30d 记录规则只能看到部分数据（比率失真）甚至为空 → 慢烧告警静静地失效。
      # 取 35d 留 5d 余量，避免窗口最老的样本刚好在评估时被回收。改 SLO 窗口时同步改它。
      - "--storage.tsdb.retention.time=35d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - ./warden_token:/etc/prometheus/warden_token:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      # 必须显式开启环境变量展开：Alertmanager 默认**不**解析配置里的 ${VAR}，
      # 会把 alertmanager.yml 的 ${ALERT_WEBHOOK_URL} 当作字面 URL → webhook 永远发不出去
      # （且不报错，告警静默丢弃）。v0.27 支持 --config.expand-env。
      - "--config.expand-env"
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-https://example.invalid/hook}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  # 可选：给 /health/ready 做探测（产生 probe_success）。不用就删掉本服务与 prometheus.yml 里对应的 job。
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    ports:
      - "127.0.0.1:9115:9115"

  # 仪表盘：数据源与仪表盘都走 provisioning（挂载即生效，不用手工导入 JSON）。
  # 打开 http://127.0.0.1:3000 → Dashboards → Warden → "Warden Agent 概览"。
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # 演练环境默认免登录（**别照搬到生产**；生产请配 GF_AUTH_* 或接 SSO）
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
