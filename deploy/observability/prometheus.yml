# Warden Agent —— Prometheus 抓取与告警接线（可整栈起：见同目录 docker-compose.yml）
#
# 关键点：`/metrics` 是**受鉴权保护**的（本项目 fail-closed：开了鉴权，包括指标在内
# 的业务端点都要 Bearer）。所以抓取必须带 token —— 用 `bearer_token_file` 从文件读，
# **不要把密钥写进本文件**（它会进版本库）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.rules.yml"
  - "/etc/prometheus/alerts/*.slo.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 应用服务：抓 /metrics
  - job_name: warden-agent
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/warden_token   # 内容 = WARDEN_API_KEY，只读挂载
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # 就绪探针（可选）：用 blackbox_exporter 探 /health/ready，产生 probe_success 指标，
  # 供 warden.rules.yml 里的 WardenReadinessFailing 使用。不用就删掉这个 job 与那条规则。
  - job_name: warden-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:8000/health/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
