# 密钥（**示例，不要直接提交真实值**）
#
# 用法：复制成 `secret.yaml`（已在 .gitignore 里挡掉）或用外部密钥管理：
#   kubectl -n warden create secret generic warden-secrets \
#     --from-literal=WARDEN_API_KEYS='alice:k-xxx,bob:k-yyy' \
#     --from-literal=WARDEN_PG_PASSWORD='...' \
#     --from-literal=WARDEN_CREDENTIAL_KEY="$(head -c 32 /dev/urandom | base64)" \
#     --from-literal=WARDEN_AUDIT_KEY="$(head -c 32 /dev/urandom | base64)"
#
# 更好的做法：用 External Secrets / Sealed Secrets / 云厂商的密钥服务，
# 让明文密钥**不进 git、也不进 kubectl 命令历史**。
apiVersion: v1
kind: Secret
metadata:
  name: warden-secrets
  labels:
    app.kubernetes.io/name: warden-agent
type: Opaque
stringData:
  # 鉴权：多用户用 `用户id:密钥` 逗号分隔（身份由 key 推出，客户端无法自称）。
  # **必须配**，否则对外监听时 run_server 会拒绝启动（fail-closed）。
  WARDEN_API_KEYS: "REPLACE_ME-user1:k-replace-me"
  # PostgreSQL 密码
  WARDEN_PG_PASSWORD: "REPLACE_ME"
  # 凭证加密密钥（每个部署独立生成；配套 WARDEN_CREDENTIAL_OLD_KEYS 做轮换）
  WARDEN_CREDENTIAL_KEY: "REPLACE_ME"
  # 审计链 HMAC 密钥（不配则退化为不带密钥的哈希链并告警）
  WARDEN_AUDIT_KEY: "REPLACE_ME"

  # Prometheus 抓取 `/metrics` 用的 Bearer **原值**（这是 Secret 的数据键，不是环境变量）。
  # 必须与某个 principal 的 key 一致，并且那个 principal 应该是**只读身份**：
  #   1) 在 WARDEN_API_KEYS 里加一个专用账号：`...,prometheus:sk-replace-me`
  #   2) 在 ConfigMap 里把它降为只读：`WARDEN_VIEWER_PRINCIPALS: "prometheus"`
  #   3) 这里填 `sk-replace-me`
  # 为什么要专用账号：`/metrics` **不在公开路径白名单**里（`web/server.py:_is_public`），
  # 抓取凭证一旦泄露且是普通/管理员账号，就能读全部审计、甚至调 `/approve`。
  WARDEN_METRICS_BEARER: "REPLACE_ME"

  # ---- 以下为**可选**密钥：按需取消注释填入；不用的**保持注释** ----
  # （注释不是洁癖：一旦以占位值出现在 Secret 里，应用会当真去用，比如带一个错的
  #   DEEPSEEK_API_KEY 就会从"离线假模型"变成"每次调用都 401"。）
  #
  # 模型供应商密钥（至少一个，才能从离线假模型切到真模型）
  # DEEPSEEK_API_KEY: "REPLACE_ME"
  # OPENAI_API_KEY: "REPLACE_ME"
  # ZHIPU_API_KEY: "REPLACE_ME"
  # DASHSCOPE_API_KEY: "REPLACE_ME"
  # custom 通用网关（OpenAI 兼容）的模型 key；**不是**鉴权 key（别拿 WARDEN_API_KEY 当它）
  # WARDEN_MODEL_API_KEY: "REPLACE_ME"
  # 语义嵌入端点 key（配 WARDEN_EMBED_BASE_URL 时才需要）
  # WARDEN_EMBED_API_KEY: "REPLACE_ME"
  # 真实搜索 provider 的 key（tavily/brave）
  # WARDEN_SEARCH_API_KEY: "REPLACE_ME"
  # 凭证密钥轮换时的历史旧密钥（逗号分隔；轮换流程见 docs/operations.md）
  # WARDEN_CREDENTIAL_OLD_KEYS: "REPLACE_ME-old-key"
  # KMS/Vault 托管（WARDEN_KMS_PROVIDER != env 时）
  # WARDEN_VAULT_TOKEN: "REPLACE_ME"
  # WARDEN_KMS_WRAPPED_KEY: "REPLACE_ME"
  # 告警 webhook 鉴权头 `k=v,k2=v2`
  # WARDEN_ALERT_WEBHOOK_HEADERS: "Authorization=Bearer REPLACE_ME"
  # OTLP 导出鉴权头（接托管后端时）
  # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer REPLACE_ME"
  # ServiceMonitor 抓 /metrics 用的 Bearer token（内容 = 某个有效 API key）
  # WARDEN_API_KEY: "REPLACE_ME-metrics-token"
