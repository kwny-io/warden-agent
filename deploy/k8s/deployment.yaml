apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-agent
  labels:
    app.kubernetes.io/name: warden-agent
spec:
  # 多副本的前提是 WARDEN_PG_HOST + WARDEN_SHARED_STATE=1（见 configmap.yaml）：
  # Run 级锁保证同一 run 不会被两个副本并发驱动（抢不到回 423）。
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 先起新的、再停旧的：滚动期间始终有副本在服务
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warden-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warden-agent
    spec:
      # 必须**大于** WARDEN_SHUTDOWN_GRACE_S（30s）：给应用时间排空请求 + 关资源
      terminationGracePeriodSeconds: 45
      # 专用 ServiceAccount（不用 default）：应用**不调 K8s API**，但 default SA 上可能
      # 挂有别人加的权限。给一个什么都不绑的专用 SA，等于把这个模糊面清零。
      serviceAccountName: warden-agent
      # 关键：不把 SA token 投进容器。默认会投（/var/run/secrets/kubernetes.io/serviceaccount），
      # 一旦 RCE，攻击者就白拿一份集群凭证——而本应用从不需要它。成本为零，收益是一整类攻击面。
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # 与镜像里的 warden 用户一致
        runAsGroup: 10001
        fsGroup: 10001            # 让挂载卷对该用户可写
        seccompProfile:
          type: RuntimeDefault
      # 尽量把副本铺到不同节点/区域（单点故障不是"多副本"）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: warden-agent
      containers:
        - name: app
          # 用**明确 tag**（不用 `latest`）：`latest` 会让"回滚"变成
          # "再拉一次、但不知道拉到什么"。
          # ⚠️ 这里**故意不写 `@sha256:` 假 digest**：占位符能过 kubeconform/语法校验，
          #    却让拉取直接 `manifest unknown` —— 风险从"apply 时暴露"推到"上线后才暴露"。
          #    真 digest 由发布流水线回写：
          #      scripts/pin_image_digests.sh --app-image <repo>:<tag>
          #    （脚本 fail-closed：解析不出 digest 就非 0 退出，不静默跳过。）
          #    本地试跑直接把 REPLACE_ME 换成你的仓库即可。
          image: REPLACE_ME/warden-agent:0.1.0
          imagePullPolicy: IfNotPresent
          # 私仓场景打开（现在注释着）：占位名不算凭据，真值用
          #   kubectl -n warden create secret docker-registry warden-registry \
          #     --docker-server=... --docker-username=... --docker-password=...
          # 注意：**开着且 Secret 不存在**会让 Pod 直接起不来（secret not found），
          # 所以默认注释掉，比"看着配好了实际卡在拉镜像"诚实。
          # imagePullSecrets:
          #   - name: warden-registry
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: warden-config
            - secretRef:
                name: warden-secrets
          # 启动探针：把"启动慢"与"运行中卡死"分开。
          # 没它的时候 liveness 从 initialDelaySeconds 起就生效，冷启动（导入 + 连 PG）
          # 慢一点就会被反复重启，而重启后又更慢——经典的 CrashLoop 自锁。
          # 有它的时候：启动期间 liveness/readiness 都被挂起，最多宽容 5×30=150s。
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # 存活：进程活着就 200（不查依赖 —— 依赖问题由 readiness 表达，
          # 否则数据库一抖就会把好端端的进程反复重启）
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪：会 ping 底层存储；不通过就从 Service 摘掉，不再接流量
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # rootfs 只读 → 需要写盘的东西（SQLite、临时文件）挂可写卷
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # ⚠️ 多副本下**不要**给 SQLite 用共享卷（跨主机共享文件系统不支持 SQLite）。
        # 配了 WARDEN_PG_HOST 时审计/记忆都走 PG，这里的卷只用于临时文件（/tmp）。
        # 单副本（不配 PG）时它才承载 SQLite 的审计/记忆。
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
