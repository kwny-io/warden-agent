# 专用 ServiceAccount（应用 Pod 用）
#
# 为什么要它而不是 default：
#   本应用**从不调用 K8s API**（不需要列 Pod / 读 ConfigMap / 写 Event）。但 `default`
#   是命名空间的公共账户——任何人给 default 加一个 RoleBinding（很常见，因为方便），
#   本应用的 Pod 就顺带拿到了那些权限。给一个**什么都不绑**的专用 SA，把这个模糊面清零。
#
# 为什么这里没有任何 Role/RoleBinding：不需要，就没有。将来真要给权限（比如读自己的
# ConfigMap 做热加载），再单独加一条最小 Role——而不是先把 default 放宽。
#
# 配合 deployment.yaml 的两处：
#   serviceAccountName: warden-agent
#   automountServiceAccountToken: false      # 连 token 都不投进容器
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden-agent
  labels:
    app.kubernetes.io/name: warden-agent
# 显式关掉 token 投影：Deployment 里也写了，但那只是"这个 Pod 不要"；
# 写在 SA 上是"用它的都别要"——两层都写，避免将来有人新建 Pod 时漏掉。
automountServiceAccountToken: false
