# gitleaks 配置：**只放宽测试夹具里那几个写死的假值，不关闭任何规则**。
#
# 背景（本地用与 CI 同一版本的镜像 1:1 复现过，不是推测）：security job 红在 7 处命中，
# 全部落在 tests/test_redaction.py 与 tests/test_approval_separation.py。这两个文件是
# 「脱敏」与「审批隔离」的用例，夹具**必须**长得像真密钥，否则根本测不出脱敏。
# 涉及的就 3 个假值：
#   · sk-live-TOPSECRET123456                                    → generic-api-key / curl-auth-header
#   · jwt.io 官方示例 JWT 的签名段（SflKxwRJSMeKKF2QT4fwpMeJf…） → jwt
#   · jwt.io 官方示例 JWT 的 payload 段（eyJzdWIiOiIxMjM0…）     → jwt（源码里跨行写，命中的是片段）
#
# 两个都是**实测踩出来的**坑，别踩回去：
#
# 1) 只放宽**值**，不放宽**路径**。
#    v8.21.2 里 paths 与 regexes 是 **OR** 关系（实测：只给 regexes 能压住、只给 paths 也能压住），
#    所以一旦写上 paths = ["tests/"]，这两个文件就变成**永久扫描盲区**——以后真有人把真密钥
#    粘进去反而发现不了。按值放宽的代价小得多：被容忍的只是这 3 个写死的字符串，别的值照报。
#
# 2) schema 必须用**单数** `[allowlist]`。
#    `[[allowlists]]`（复数数组，新版本写法）在 v8.21.2 里是**被静默忽略**的：
#    实测连 catch-all（regexes = [".*"]）都清不掉任何命中——配置被读了，但等于没写。
#    这类"配置看起来生效、其实没生效"的坑只能靠**主扫描跑一遍**发现，所以下面这条也请保留：
#
# 3) [extend] useDefault 必须留着。
#    自定义配置会**替换**默认规则集；少了 extend，本配置自身没有任何规则，
#    结果是"扫不出任何东西"——比红灯更糟（扫描器事实上被关掉）。
#
# 这份配置有**反向对照**兜着：ci.yml 的「秘密扫描反向对照」步骤会往临时文件里丢一个
# 未被放宽的高熵假密钥，必须仍被报出来；没报出来就说明扫描器被关掉了，直接红灯。#
# 4) 第八十一批 F3 的 security job 就红在这里（3 处命中，实测原文记在 CHANGELOG）：
#    `receipts/05d73a2ce2e6.yaml:16`（keys_before）、`:17`（keys_after）、
#    `tests/DELIVERY_LEDGER.yaml:211`（keys）——回执/台账里的**内容哈希**是 16 位十六进制
#    （形如 a1dfe4a01ca7b74d），而 generic-api-key 规则是按「字段名像 key + 值够高熵」判的，
#    实测熵 3.5778 > 该规则阈值 3.5 ⇒ 假阳。那三个字段是我们自己定的指纹字段，不是凭据。
#
#    放宽方式：**按字段名锚定**（`regexTarget = "line"` + `keys(_before|_after)?:\s*[0-9a-f]{16}\b`）。
#    另外两条路都试过、都不行：
#      · 按**值的形状**放宽（"任何 16 位十六进制"）=> 真凭据只要长得一样就一起被吞；
#      · 按**路径**放宽（`receipts/`、`tests/`）=> 那两个文件成为永久盲区（paths 与 regexes 是 OR）。
#    第 1 条路被反向对照的第 ④ 条钉住，第 2 条被第 1 条那段理由钉住（按值放宽的教训）。
#    第 97 批又红了一次，同一个原因的新写法：测试夹具里是**字典键**的写法
#    （`"keys_before": "0123456789abcdef",`）与**函数 kwarg** 的写法（`receipt(keys_after="fedc…")`），
#    字段名两边多了引号、分隔符不是冒号 ⇒ 旧正则锚不住 ⇒ 又成了假阳。
#    所以锚点改成「可选引号 + 冒号或等号 + 可选引号包住的值」，**仍然只按字段名 + 16 位十六进制**放宽，
#    不放宽路径、也不放宽「任意 16 位十六进制」（那会把真凭据一起吞掉）。
#    （RE2 没有反向断言，所以用 `\b` 而不是 `(?![0-9a-f])`。）
#
#    ci.yml 的「秘密扫描反向对照」步骤现在跑的是 `scripts/gitleaks_reverse_control.sh` 的**4 条**对照
#    （上面那段说的"丢一个未被放宽的假密钥"是其中第 ① 条；③④ 是这次修法一起加的）。
[extend]
useDefault = true

[allowlist]
description = "脱敏/审批隔离用例里写死的假密钥夹具（3 个固定字符串，非真实凭据）+ 回执/台账里我们自己的内容哈希字段（按字段名锚定，不按值的形状）"
# 默认的 regexTarget 是**命中片段**（只有那 16 个字符），字段名根本不在里面 ⇒ 必须显式改成 line，
# 否则下面最后那条锚定正则永远匹配不上（"配了但没生效"——本文件顶部第 2 条就是同类坑）。
regexTarget = "line"
regexes = [
  '''sk-live-TOPSECRET123456''',
  '''SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
  '''eyJzdWIiOiIxMjM0NTY3ODkwIn0''',
  '''["']?keys(_before|_after)?["']?\s*[:=]\s*["']?[0-9a-f]{16}\b''',
]
