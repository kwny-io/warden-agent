[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warden-agent"
version = "0.1.0"
description = "Warden Agent 的 Python 版：可恢复、可治理的 Agent 运行时"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Warden Agent Python" }]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
    "pydantic>=2.0",
    "cryptography>=42",
    # Windows 沙箱的资源限制走 Windows Job Object（见 execution/_platform.py 的
    # _make_win32_limiter），需要 pywin32 提供的 win32job。此前没声明——
    # 系统里恰好装着才没暴露；照 lock 从零装的环境里会直接 ModuleNotFoundError。
    # 只对 Windows 生效，Linux/macOS 不会装它（POSIX 走 resource.setrlimit，标准库自带）。
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright",
    "psycopg[binary]",
    # 依赖漏洞扫描（CI 里对 lock 固定的运行依赖做门禁；见 .github/workflows/ci.yml）
    "pip-audit>=2.7",
]
postgres = ["psycopg[binary]"]
# 密钥托管（KMS/HSM）：aws-kms 模式需要 boto3。vault-transit 走 httpx（已在依赖里），无需额外包。
aws = ["boto3>=1.34"]

[project.scripts]
warden = "warden_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
# src 布局：让 pytest 能找到 warden_agent 包，也能把 tests 当包导入
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.12"
packages = ["warden_agent"]
strict = true

[tool.coverage.run]
source = ["warden_agent"]
