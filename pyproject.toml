[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warden-agent"
version = "0.1.0"
description = "Warden Agent 的 Python 版：可恢复、可治理的 Agent 运行时"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Warden Agent Python" }]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
    "pydantic>=2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright",
    "psycopg[binary]",
]
postgres = ["psycopg[binary]"]

[project.scripts]
warden = "warden_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
# src 布局：让 pytest 能找到 warden_agent 包，也能把 tests 当包导入
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.12"
packages = ["warden_agent"]
strict = true

[tool.coverage.run]
source = ["warden_agent"]
