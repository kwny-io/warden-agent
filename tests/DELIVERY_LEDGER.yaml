# 「已交付提交」的台账：把「回执说它验的是哪棵树」变成 CI 自己会核的东西。
#
# 为什么会有这个文件（第七十九批 / #46-3）：
#
#   * 第七十八批**第九处**：交付面写着「本地冻结 `wa78/freeze78h.log`、tree `e1ddf6a3…`」，
#     而实际交付的 Z2 树是 `83891221…`（= `wa78/freeze78i.log`）——**回执指到了被作废的那次冻结**。
#     语法正确、文件都存在、引用的提交都存在：任何文本守卫都抓不到，
#     当时唯一的防线是「提交前逐句读 staged diff」（靠人记得，不是机制）。
#   * 同一批承认的最大空白：冻结闸门住在仓库外 `wa78/`，**仓库里没有任何东西**能证明
#     「我跑测试时的那棵树 == 我交付的那棵树」。`wa78/z78_finish.sh` 是原型，且只在本机跑过。
#
# 这份台账可核的部分只有一件，但它是硬的那件：
#
#     git rev-parse <sha>^{tree}  必须等于该行的 tree
#
# 于是「台账/回执指着另一棵树」在 CI 上就是红的，不需要有人记得去读。
#
# 回填规则（**这是本台账能被核的前提**）：台账**必须有 `HEAD^` 那一行**、且**不许有 `HEAD` 自己的行**。
#   一个提交没法在自己的正文里写下自己的树——写进去，树就变了（自引用无解，第七十八批第八/九处同源）。
#   所以：**每个已交付提交由下一个提交背书**。删掉 `HEAD^` 那行就撞红，逼人回填。
#   口径由**事件 + ref** 分派（唯一判据在 `tests/test_delivery_ledger.py` 的 `_refill_applies`）：
#   `push` / 本机 = 严格；`refs/tags/*` 检出与 `pull_request` 的**合并提交**检出 = 回填义务不适用
#   （那两个父级还没有「已交付提交」的身份）——而不适用必须**两边都对上：事件 + ref 形状**：
#   PR 检出要真的是合并提交（≥2 父级）；**发布 tag 检出的事件要真的是 `workflow_dispatch`**
#   （本仓 `ci.yml` 的 `push` 只过筛 `branches`、不含 tag ⇒ 「检出的是 tag」这条路只可能来自手动派发；
#   这条前提由 `tests/test_delivery_ledger.py::test_口径分派_本仓的检出形状都认得` 直接读 `ci.yml` 钉住）。
#
#   一句诚实话：豁免只解掉**回填义务**。「`sha` 必须是 HEAD 的祖先」与「不许有 HEAD 自己的行」
#   无条件生效 ⇒ 拿一个指向**已登记提交**的发布 tag 去跑仍会红（tag 这条路在设计上不是一条能绿的
#   路径，它只是「不因为回填义务而红」）。本批没修它，如实记着（外部复核提出的第二天）。
#
# `attestation` 两档，**不许自报数字**：
#   * `git-only`   ：只有 tree 可核（早期的冻结回执里没有三对账行，见下）
#   * `git+frozen` ：另有**仓库外**的冻结回执给出 shape/keys（跑前=跑后），三件必须同时给
#     —— 三对账（tree/shape/keys）是第七十八批 `freeze78g` 起才进冻结脚本的，
#     所以 X/Y 只有 tree 可核；**没有回执就不许写数字**，宁可留空。
#
# `run` 只核形状：run 号在 GitHub 上、CI 里核不到，不假装核过（见 `tests/test_delivery_ledger.py` 末尾）。
# X 与 Y 是**同一次 push**，所以共用 run `38076347508`（该 run 的 head 是 Y，X 结构上没有独立 run）。
#   ⚠️ 这两句是**散文**：没有任何判据覆盖它（`run` 只核「非空时是纯数字」）。外部复核点名过：
#   这类话看上去像被核过，其实没有——要核它得用 `gh api` 查那个 run 的 head，CI 里做不到。
#
# 范围：从第七十八批（`7140ead`）起。更早的提交没有可核回执，不回填、不猜。
#   （这个起点现在是**机器可读**的：头部 `coverage_from` —— 守卫会核「`HEAD^` 到它之间不许有洞」。
#    实测教训：只核 `HEAD^` 那一行时，`dev` 上连着攒两个本地交付提交就会在台账里留洞，
#    而 `HEAD^^` 那个洞在 2026-09 之前**没有任何判据看得见**。）
# **交付面分支（`delivery_branch`）**：回填义务只对**交付面**上的检出成立。推一个功能分支时，
#   被检出的提交（`HEAD`）是那条分支上的在飞提交，它不欠「由下一个交付提交背书」这个账；
#   而**内容判据（tree/sha/祖先/重复/自报数字）照旧全部适用** —— 豁免只解掉回填这一条。
#   声明缺失 = **不豁免任何分支**（fail-closed：不许把「没写」读成「都放行」）。
#   这一行同时是「交付面到底是哪个分支」的**机器可读答案** —— 参赛提交清单指 `master`、
#   判据全长在 `dev` 那件事，改路线时改的就是这一行（见桌面 77 号文档的下一批候选）。
delivery_branch: dev
# 连续覆盖起点（含）：从 `HEAD^` 沿 first-parent 链走到这一跳的每一跳都必须有台账行
#（判据 7，守卫：`tests/test_delivery_ledger.py::_coverage_violations`）。
# 要扩大范围就改这一行声明并说明理由；**删掉这一行 = 连续性核不动 = 红**（fail-closed，
# 与 `delivery_branch` 同一条口径：「没写」不许读成「都放行」）；往范围外加行也会红。
