# 「被 if: 门控的 job」签字台账。
#
# 为什么会有这个文件：一条**没跑**的 job 在 run 结论里长得像一次**成功**——run 页面上
# 「success」分不出「整条交付链都验过了」和「最关键那几步今天压根没跑」。本仓已经吃过两次这个亏：
#
#   * 第六十八批把 `gh run list` 里的 `success`（run 37456267583）当作"交付面全绿"的证据写进了
#     `docs/复核索引.md`，而那个 run 里 `image-signing` 与 `mutation` 都被 `if:` 挡掉、**skipped**；
#   * 第六十九批我在同一个 sha（68501ec）上手跑了一次 `workflow_dispatch`（run 37464309137），
#     `image-signing` 第一次真的跑起来，**当场红**：失败在「把 digest 钉进部署清单」——
#     既有"钉完 0 处也算成功"，又有"脚本索引模式 100644 ⇒ 126"。
#
#     ⇒ 结论：**run 绿 ≠ 交付链绿**。哪些 job 在什么事件下不跑，必须有人签字、有地方查。
#
# 与 `tests/SKIP_LEDGER.yaml` 的关系：那个台账管"**用例级**跳过"（pytest 的 skipped），
# 由 `scripts/check_skipped_tests.py` 校验；这里管"**job 级**门控"，由
# `tests/test_ci_job_gates.py` 校验。两者是同一件事的两个层级：跳过必须有人签字。
#
# 三条规则（新增门控自动撞红，不需要人记得来改）：
#   1. `ci.yml` 里任何一个带 `if:` 的 job，**没有条目就是红**。
#   2. `gate` 必须与 workflow 里的 `if:` 表达式**逐字一致**；改了条件就撞红，
#      逼人回来写清"这次改的是什么时候不跑"。`not_run_on` 必须写明它会在哪些事件上缺席。
#   3. `run_it_now` 必须把 `workflow_dispatch` 的**必需入参**带齐（即 `-f tag=…`）。
#      ——第六十九批收尾时补的：台账第一版两条 `run_it_now` 都写成 `gh workflow run ci.yml --ref dev`，
#      而 `ci.yml` 的 `workflow_dispatch.inputs.tag` 是 `required: true`（有意如此：不让分支名冒充版本号），
#      于是那条命令**抄下来就跑不动**：GitHub 回 `HTTP 422: Required input 'tag' not provided`。
#      原来的判据只断言它以 `gh workflow run` 开头 ⇒ 钉在文字上、不会红——与台账想治的是同一种病。
#
#   4. **step 级跳过也要签字**（第七十批补）：workflow 里**某个 step 内部**自己决定“不跑”
#      （形如 `echo "::notice::…"` + `exit 0`）时，run 结论与“真跑了”**一模一样**——
#      连 step 级 conclusion 都同样是 `success`（平台事实，本批实测：
#      `gh run view … --json jobs` 里 `evals-real` 的“模型质量评测（--mode real）”= `success`，而它其实没跑）。
#      ⇒ 这一层 API 看不见、只能靠台账：登记在下面的 `step_gates:` 段里，写清“什么时候跳（skip_when）、
#      签字开关叫什么（allow_flag）、跳过时产出哪个 artifact 当回执（receipt_artifact）、日志里必须出现什么字样（notice）”，
#      由守卫断言它们都还活在 workflow 里；`ci.yml` 里任何 step 出现“静默跳过”形态而未登记 ⇒ 红。
#
#   5. **触发器级缺席也要签字**（第七十一批）：`on.schedule` 写在哪 **不等于** 它会响——GitHub 只从
#      **默认分支** 上的 workflow 文件求值 `schedule`（平台文档原文：*This event will only trigger a
#      workflow run if the workflow file exists on the default branch* / *Scheduled workflows will only
#      run on the default branch*，
#      https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows ）。
#      本仓实测：cron `0 3 * * 1` 于 `2760bd6`（2026-09-22）加进 `dev` 的 `ci.yml`，而默认分支是 `master`
#      （HEAD 停在 2026-09-07，`dev` 领先 122 提交），`master` 的 `ci.yml` 里 **没有** `schedule:`
#      ⇒ 全仓 69 次 run 里 `event=schedule` **0 次**（应交火 2 次：2026-09-28 / 2026-10-05）。
#      ⇒ 文件末尾的 `triggers:` 段：每个“我承诺它会自己响”的触发器都要登记 cron / 从哪个分支被求值
#      （`evaluated_from`）/ 观察到过几次（`last_observed_fire`）/ 怎么验（`how_to_verify`）/
#      什么时候必须回来复核（`review_by`，过期即红）；`last_observed_fire: never` 的条目还必须写
#      `root_cause`（为什么没响）与 `unblock`（怎样才能响，含代价）。
#
# 怎么真跑（验证门控后面的东西到底还活着没有）：
#   gh workflow run ci.yml --ref <分支>            # 手动触发，所有 workflow_dispatch 门控都会跑
#   gh run watch <run-id> && gh run view <run-id> --json jobs
#
# 注意：**不要**为了让某次 run "看起来更完整"而把门控删掉——门控有它的成本/风险理由
# （见每条 why）。要的只是"缺席要看得见"，不是"每次 push 都全跑"。
entries:
  - workflow: ci.yml
    job: mutation
    gate: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
    runs_on: [workflow_dispatch]
    runs_on_note: >
      第七十一批修正：原来这里写 `[schedule, workflow_dispatch]`——但“写在 `if:` 里”不等于“会发生”。
      本仓的 cron 从未被求值（默认分支不是 `dev`；见末尾 `triggers:` 段的 `ci.yml / schedule`），
      所以事实口径只有 `workflow_dispatch` 一条。`if:` 里的 `schedule` 仍然留着（那一天它会跑 4 个分片），
      等 trigger 修好（`review_by` 2026-11-07）再把 `schedule` 加回这一行——加回来之前，
      守卫 `test_声明在_schedule_上跑的条目必须对应一个真的会响的触发器` 会拦住这次漂移。
    not_run_on: [push, pull_request]
    why: >
      变异测试要跑 4 个分片、每个分片都要把源码逐个突变后重跑测试——放每次 push 上会把
      开发回环拖成小时级。它也不是那种"漏一次就有安全事故"的门禁：变异分数是**趋势性**指标，
      周更 + 手动足够。代价必须写明白：push 上的绿灯**不含**它。
    run_it_now: gh workflow run ci.yml --ref dev -f tag=v0.1.0-rcNN   # tag 是必需入参，见文件头规则 3
    added: 2026-10-06
    evidence: "run 37461282520（push：skipped）/ run 37568118099（push：skipped；同一 run 里 6 个非门控 job 全 success）/ run 37464309137（dispatch：4 片全 success）"

  - workflow: ci.yml
    job: image-signing
    gate: "(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'"
    runs_on: [push (v* tag), workflow_dispatch]
    not_run_on: [push (普通分支), pull_request]
    why: >
      keyless 签名要 `id-token: write` 与 GHCR 推送权限，签的对象必须是**要发布的那个镜像**；
      PR 与普通分支 push 上没有可发布对象，硬签只会把别人的 PR 弄红（与本仓"新门禁不得误伤 PR"
      的取向一致）。代价：**dev 分支上每次 push 的绿灯从来不覆盖"签名 + 钉 digest"这条路**——
      第六十九批之前没人意识到这一点，于是这两条路各自带着一个"空洞的成功"潜伏到了发布当天。
    run_it_now: gh workflow run ci.yml --ref dev -f tag=v0.1.0-rcNN   # 必需入参：缺它直接 HTTP 422
    added: 2026-10-06
    evidence: >
      run 37461282520（push：skipped）/ run 37464309137（dispatch：红在「把 digest 钉进部署清单」，
      两个根因都在第六十九批修掉）/ run 37540647177（dispatch：**全绿**——真构建、真推 GHCR、
      真取回 registry 权威 digest、真 keyless 签名、用外部验证者约束独立校验、真钉 digest）：
      run 37568118099（push：skipped，与 not_run_on 逐字一致；同一 run 里另外 6 个 job 全 success）——
      这条门已从「存在但从未运行」变成「跑过且通过」

# ─────────────────────────────────────────────────────────────────────────────
# step 级门控（第七十批）：**run 结论看不见它们**，所以只能靠“登记 + 签字 + 回执”。
#
# 为什么不能像 job 级那样只写为什么：job 被 `if:` 跳过时，API 直接告诉你 `skipped`；
# 而 **step 内部自己 `exit 0`** 的跳过，step 级 conclusion 仍是 `success`（平台事实，无解）。
# 所以这里的每条都必须指向一个**可以从 run 外部判定的东西**：artifact 回执。
# 回执的语义是双向的：**有 `receipt_artifact` ⇔ 那一步真没跑**。
step_gates:
  - workflow: ci.yml
    job: evals-real
    step: 模型质量评测（--mode real）
    skip_when: >
      `secrets.DEEPSEEK_API_KEY` 为空。本仓当前**没有配置**这个 secret（fork / 外部 PR 也永远拿不到），
      所以每次 CI 都走跳过分支——“真实模型质量评测”从建立至今一次没跑过。
    allow_flag: ALLOW_EVAL_SKIP
    receipt_artifact: eval-skip-receipt
    notice: "未配置 DEEPSEEK_API_KEY"
    how_to_really_run: >
      只能靠配好仓库 secret `DEEPSEEK_API_KEY`（外部凭据，属于运维动作，代码侧无解）。
      配好之后这一步会走真评测分支：`--min-pass-rate 0.6` 是真门禁（退码 1 = 低于阈值）。
      签字开关不影响它：`ALLOW_EVAL_SKIP` 只管“没 key 时到底该红还是该绿”。
    added: 2026-10-07
    evidence: >
      run 37570764622（push：`evals-real` job=success，但**这一步没跑**；step 级结论同样是 success，
      API 看不出来，只有日志里的 `##[notice]` 能作证——job `112628616387` 第 202 行）。
      第七十批加入签字 + 回执后：没签字 ⇒ 这一步直接红（已用从 `ci.yml` 抽出的脚本在本地跑通两个分支：
      `ALLOW_EVAL_SKIP=1` 下 RC=0 并产出回执 + 写入 step summary；开关置空下 RC=1 且**不**产回执）；
      签字 ⇒ 绿，但必须带 `eval-skip-receipt` artifact。
      **已复核（第七十批，push run 37583001400 @ 14dc3a03）**：为什么还绿 = 因为写了 `ALLOW_EVAL_SKIP=1` 并产出了回执；
      该 step 结论 success 且 artifact 列表里确实有 `eval-skip-receipt`（461 B，内部含 `run_id`/`sha`/`event`
      ⇒ 回执与它所属的 run 对得上）；同一 run 里 `quality`/`security`/`sbom`/`migration`/`container` success，
      `image-signing` / `变异测试` 按各自门控 skipped。

# ─────────────────────────────────────────────────────────────────────────────
# 触发器级（第七十一批）：**“我承诺它会自己响”本身就是一个必须被验证的断言。**
#
# 为什么需要这一层：`schedule` 这类触发器的缺席**没有任何本地痕迹**——没有 run、没有日志、
# 没有红色，什么都没有，而 `on:` 块在文件里照样好看。本仓已经吃过一次：cron 写在 `dev` 上，
# 默认分支是 `master`，于是“每周一 03:00 的体检”从 2026-09-22 至今**一次都没发生过**，
# 而 `docs/operations.md` 与下面的 `runs_on` 都把它当“会跑”在引用。
#
# 三层的关系：job 级管“哪些 job 在什么事件下不跑”，step 级管“哪一步自己决定不跑”，
# 这一层管“**那个事件本身到底会不会发生**”。三层合起来才回答“这次绿灯覆盖了什么”。
triggers:
  - workflow: ci.yml
    kind: schedule
    cron: "0 3 * * 1"
    evaluated_from: 默认分支
    why: >
      依赖与基镜像的新 CVE **不需要改代码就会出现**：只在 push/PR 上扫描的话，“没人提交”就等于
      “没人检查”（本仓实测过：用陈旧缓存的基镜像扫会命中 13 条“其实已修”的 CVE，拉新后 0 条）。
      它同时是 `mutation`（4 分片变异）与 `image-signing`（真签名 + 钉 digest）的唯一“正常”触发——
      也就是说，这一条 cron 不响，等于那两条门每次 push 的 `skipped` 永远等不到自己的那一天。
    expected_cadence_days: 7
    last_observed_fire: never
    root_cause: >
      `schedule` 只从**默认分支**的 workflow 文件求值。本仓默认分支是 `master`（HEAD `ad98639`，
      2026-09-07 之后无提交），而 cron 写在工作分支 `dev` 的 `ci.yml` 里（`2760bd6` 2026-09-22 加入；
      `dev` 已领先 `master` 122 提交）；`master` 上的 `ci.yml` 只有 `push: [master]` 与 `pull_request`，
      **没有** `schedule:`。⇒ 这份 cron 永远不会被求值，而不是“这次没轮到”。
    unblock: >
      两条路，都要**仓库所有者**决定（所以这条 trigger 现在带着 `review_by` 期限）：
      (1) 把默认分支改成 `dev`（`gh repo edit --default-branch dev`）：本仓开发全在 `dev`、`master` 已停
      122 个提交，改完 cron 立刻生效、且默认分支上的 workflow 就是最新版；代价是仓库首页/PR 基线/新克隆的
      默认分支都变。
      (2) 保持 `master` 为默认分支，把 `schedule:`（以及它要跑的 job）同步到 `master` 的 `ci.yml`：
      代价是定时跑的是 `master` 的**旧代码**——等于体检一个月前的仓库。
      两条路都没走之前，这条 trigger 的诚实状态就是“声明的、从未发生”。
    how_to_verify: >-
      gh run list --event schedule --limit 5 --json databaseId,conclusion,createdAt（空数组 ＝ 从未响过）
      ；gh repo view --json defaultBranchRef --jq .defaultBranchRef.name（默认分支是否就是 cron 所在分支）
    review_by: 2026-11-07
    added: 2026-09-22
    evidence: >
      2026-10-07 实测（全部命令可复现）：全仓 run 按事件分组 = {dynamic: 1, push: 66, workflow_dispatch: 2}
      （合计 69，已取全量）⇒ `schedule` **0 次**；`gh run list --event schedule --limit 20` ⇒ `[]`；
      `gh repo view --json defaultBranchRef` ⇒ `master`；`git show origin/master:.github/workflows/ci.yml`
      ⇒ `on: push: branches: [master] / pull_request`（无 schedule；`git ls-tree origin/master -- .github/workflows`
      显示默认分支上只有这一个 workflow）；`git rev-list --count origin/master..origin/dev` ⇒ 122。
      应交火 2 次（cron 加入之后的周一：2026-09-28、2026-10-05）、实交火 0 次。
