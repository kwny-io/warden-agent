  - workflow: delivery-audit.yml
    kind: schedule
    cron: "0 6 * * *"
    evaluated_from: 默认分支（master）
    fires_jobs: [audit]
    why: >
      交付面红着 21 小时没人喊：`dev@5c0faa5`（2026-10-15T17:57 那次 push）起 `quality` 就红着
      （台账缺 `HEAD^` 那一行），直到 2026-10-16 人肉才发现。三条机制叠在一起才能解释「为什么会漏」：
      run 练≠交付链绿（`skipped` 长得像成功）、`gh run list` 的结论是 run 级而不是 job 级、
      而「最近一次 completed run」还可能取到**别的提交、别的事件**（周一 03:00 那条 `schedule`）。
      这条 cron 是目前唯一会**主动**把交付面的红说出来的东西（开/更新 issue，`issues: write`）。
    expected_cadence_days: 1
    last_observed_fire: 2026-10-17
    last_checked: 2026-10-17
    first_possible_fire: 2026-10-17
    root_cause: >
      2026-10-17 实测：**它一次都没响过，而且现在仍然响不了**——决定性证据是「默认分支上注册了哪些 workflow」：
      `gh api repos/kwny-io/warden-agent/actions/workflows` 只有 3 条（`ci.yml` + Dependabot ×2），
      `gh api repos/kwny-io/warden-agent/contents/.github/workflows?ref=master` 只有 `ci.yml`，
      `gh run list --event schedule` **0 条**。`schedule` 只从默认分支（`master`）求值
      ⇒ 文件不在 `master` 上，这条 cron 连注册都没有。
      上一批写的 `first_possible_fire=2026-10-17` 是**过期判断**：当时这个文件只在 `fix/batches-83-86`（PR #19 待合）。
      现在 PR #19 已合进 `dev`（squash 提交 `10738df`，2026-10-16T17:58:37Z），但 `master` 仍停在 `17cd5e5`
      （落后的 4 个提交＝合并提交与那三个探针提交）⇒ 首响条件改成「`master` 前进之后的第一个 06:00 UTC」，
      这里取下界 2026-10-18。（**已被现实推翻**：首响的边界是「`master` 前进之后的第一个 06:00 UTC」，
      而 `master` 在这之后就已前进到 `10738df` ⇒ 首个边界是 **2026-10-17T06:00Z**，不是 10-18。
      多算一天的机制跟 `date.today()` 那处是同一个：拿本地日期当 UTC 日期用。）
      2026-10-17 复核结论（三条前提里两条已经过期）：
      ① `master` 已前进到 `10738df`（含本文件）⇒ 上面「master 仍停在 17cd5e5」已过期；
      ② 它当天就按 cron 响了：run `39023515046`（`schedule`、`master@10738df`、创建于 2026-10-17T10:04:32Z）；
      ③ 它的审计结论是**红**：`dev@f6bcd50`（dev 的 tip）整个 run 与 `quality` job 双红，而 `master@10738df` 绿
      ⇒ 交付面当时确实是红的，它喊对了，并按 `issues: write` 自动开了 issue——这正是它存在的意义。
      ④ 剩下的不是 unblock，而是「别让 `dev` 的 tip 红着」（那是交付面本身的问题，见 `10738df` 那一行）。
      ⚠️ **别靠改日期了事**：日子只是提醒。真正的 unblock 是让 `master` 前进，而这一步同时是台账口径的硬前提
      （每一行的绿 run 必须同时来自 `dev` 与 `master` 两条 push run，例外清单 `UNPROVEN_ALLOWED` 冻结在三条、只许减不许增）。
    unblock: >
      **已 unblock（2026-10-17 复核）**：`master` 已前进到 `10738df`，它当天就按 cron 响了（run `39023515046`），
      此后每天 06:00 UTC 自己跑。原先写的「让 `master` 前进」这一步已完成；而这一步同时是台账口径的硬前提
      （见 `root_cause`）⇒ 它也解掉了台账口径的一半。
      代价（重要）：在那之前**连 `workflow_dispatch` 也用不了**——dispatch 同样要求文件已在默认分支上
      ⇒ 想立刻验证只能本地跑（已实测：`python scripts/delivery_audit.py --branch <分支>`）。
    how_to_verify: >
      `gh run list --workflow=delivery-audit.yml --limit 5`（0 条 = 还没响过）；
      再 `gh workflow list --all` 看它在不在默认分支上（不在就不可能响）。
    review_by: 2026-11-16
    added: 2026-10-16
    evidence: >
      2026-10-16 对本机工作树实跑（真 API，非模拟）：`--branch dev` ⇒ 2 项红
      （`dev@5c0faa5` run 38781636407：整个 run 不绿 + `quality conclusion='failure'`）、RC=1；
      `--branch fix/batches-83-86` ⇒ 2 项红（run 38881109481，就是那条 `核不动` 的形状步骤）。
      ⇒ 正反两面都被真数据走过：它确实会在交付面红时喊，也会把红的**具体 job**说出来。
      2026-10-17 复核「还没轮到」这个说法：默认分支上注册的 workflow 只有 3 条（`ci.yml` + Dependabot ×2），
      `master` 的 `.github/workflows/` 里只有 `ci.yml`，`gh run list --event schedule` 0 条
      ⇒ 当时它确实不可能响，且原因不在 cron 本身而在「文件不在默认分支上」。
      **这段是同一天早先的观察，当天下午就被推翻了**（`master` 前进之后它就自己注册了）：
      `gh run list --workflow=delivery-audit.yml` ⇒ run `39023515046`，`schedule`、`master@10738df`、
      `2026-10-17T10:04:32Z`、conclusion=`failure`；逐 job 看是 `audit` 红，而红的原因不是脚本坏了，
      是它如实报出交付面是红的（`dev@f6bcd50` 红）——审计装置首次真响就命中真问题。
      教训（值得写成判据）：`gh run list` 说「0 条」只能证明「到那一刻为止没响过」，
      不能证明「不可能响」；把「不可能」写进台账前，先复核它的前提条件是否当天已经变了。
